<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AirMesh</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: ui-monospace, Menlo, monospace; color: #dff; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* kept on-page (not display:none) so every browser keeps decoding frames */
  video { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  /* light glass UI: white strips and pills over the camera */
  #hud { position: fixed; left: 16px; top: 16px; font-size: 12px; line-height: 1.65; white-space: pre; color: #1b1e22; background: rgba(255,255,255,.88); padding: 8px 14px; border-radius: 6px; box-shadow: 0 2px 14px rgba(0,0,0,.18); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); pointer-events: none; }
  #hud b { font-weight: 600; color: #1b1e22; }
  #hud .dim { color: #6b7280; }
  #status { display: none; }
  #rec { position: fixed; right: 16px; top: 16px; font: 500 13px system-ui, -apple-system, "Segoe UI", sans-serif; color: #1b1e22; background: rgba(255,255,255,.88); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; box-shadow: 0 2px 14px rgba(0,0,0,.18); }
  #rec.on { color: #fff; background: #d6334a; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<video id="video" autoplay playsinline muted></video>
<div id="hud">loading hand model…</div>
<div id="status">STARTING</div>
<button id="rec" title="record a clip (R)">● REC</button>

<script type="module">
import { HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

  + (d3(lm[4], lm[17]) > d3(lm[3], lm[17]) ? 1 : 0);

  const h = Array.from({ length: 21 }, () => ({ x: 0, y: 1 }));

{ // self-check: turning the hand 70° away from the camera leaves the 3D pinch and finger count unchanged
  const turn = h => h.map(p => ({ x: p.x * Math.cos(1.22), y: p.y, z: p.x * Math.sin(1.22) }));
  const h = fake(true); h[9] = { x: 0, y: .55 }; // a real middle knuckle, so the pinch ratio has a hand size to divide by
  console.assert(Math.abs(pinchOf(turn(h)) - pinchOf(h)) < 1e-9 && countFingers(turn(h)) === 5, "3D gesture self-check failed");

function pickedCount() {
  if (!hands.length) return 0;

  stab.c = n === stab.n ? stab.c + 1 : 0; stab.n = n;
  return stab.c === 8 ? n : 0;

// ---- small drawing helpers ----

  ctx.save(); ctx.fillStyle = color; ctx.shadowColor = UI.shadow; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(x, y, 6, 0, TAU); ctx.fill(); ctx.restore();

  ctx.save(); ctx.font = FONT;

  ctx.fillStyle = UI.pill; ctx.shadowColor = UI.shadow; ctx.shadowBlur = 10;

// =====================================================================
// MODE 2: Portal — thumb+index of both hands frame a live camera filter
// =====================================================================
const EFFECTS = ["Heatmap", "Anime", "Blueprint", "Thermal", "Matrix", "Pop art", "X-ray", "Neon edges", "Cartoon", "Sketch", "Emboss", "Night vision", "Glitch",

const SPARK = [[255, 255, 255], [255, 120, 220], [255, 230, 120], [160, 255, 230]];
const PIX = 4; // portal pixel size
const small = document.createElement("canvas"), sctx = small.getContext("2d", { willReadFrequently: true });
const maskSrc = document.createElement("canvas"), mctx = maskSrc.getContext("2d");
const maskSmall = document.createElement("canvas"), msctx = maskSmall.getContext("2d", { willReadFrequently: true });

// per-frame buffers for fx(): src = untouched camera pixels, plate = learned empty background (known = seen without you),
// bg = plate with never-seen gaps inpainted, echo = fading person trails
let src, plate = null, known = null, bg = null, echo = null, rowShift = [], unseen = 0;
// fill pixels never seen as background from the surroundings (push-pull inpainting, in the spirit of cv.inpaint):
// average known pixels down a pyramid, then pull those averages back up into the holes
const pyr = [];
function inpaint(w, h) {

                + (c.r[(y1 * c.w + x0) * 3 + j] * (1 - fx_) + c.r[(y1 * c.w + x1) * 3 + j] * fx_) * fy;

const blueprint = l => l < .25 ? [8, 10, 70] : l < .5 ? [25, 40, 190] : l < .72 ? [60, 120, 255] : [190, 215, 255];
const thermal = l => { const t = l * 3.999, i = Math.floor(t), f = t - i, p = THERMAL[i], q = THERMAL[i + 1];
  return [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f, p[2] + (q[2] - p[2]) * f]; };

  const mi = mctx.createImageData(mw, mh);

const portal = {
  name: "Portal",
  get help() { return `make an L with thumb + index on BOTH hands\nthe space between them becomes a live filter\nfilter: ${EFFECTS[effect]} — tap thumb + index together (or E) for the next one`; },
  draw(now) {

      if (h.pinch < PINCH && !tapped[i]) { tapped[i] = true; effect = (effect + 1) % EFFECTS.length; }
      else if (h.pinch > .5) tapped[i] = false;

      tag("raise both hands — thumb + index make the corners", W / 2 - 200, H / 2);

    sctx.save(); sctx.scale(1 / PIX, 1 / PIX); sctx.translate(W, 0); sctx.scale(-1, 1);
    sctx.drawImage(video, map.ox, map.oy, map.dw, map.dh); sctx.restore();

// =====================================================================
// MODE 3: Particles 3D — rotate / zoom / explode a point-cloud model
// =====================================================================
const NP = 2200;

  1: ["Torus knot", i => { const t = i / NP * TAU, r = 2 + Math.cos(3 * t), j = () => (R() - .5) * .1;

    const t = R(), a = t * TAU * 3 + (i % 3 ? Math.PI : 0); return [Math.cos(a) * .45, (t - .5) * 2.6, Math.sin(a) * .45]; }],
  3: ["Galaxy", i => { const r = R() ** .6 * 1.3, a = r * 4 + (i % 3) * TAU / 3 + (R() - .5) * .5;
    return [Math.cos(a) * r, (R() - .5) * .1 * (1.4 - r), Math.sin(a) * r]; }],
  4: ["Sphere", i => { const y = 1 - 2 * (i + .5) / NP, r = Math.sqrt(1 - y * y), a = i * 2.39996;

// ---- mini-game helpers: saved best scores, the big score at the top, spark bursts, timed rounds ----

// a timed round: starts when a hand shows up, runs ROUND_MS, then shows the result for a moment before the next one

// ---- keep-up: bounce glowing balls off your palms and don't let them drop ----
const ku = { balls: [], prev: [], score: 0, best: loadBest("keepup"), lost: 0, flash: [] };

const keepup = {

// ---- bubbles: poke the bubbles floating up with any fingertip; quick pops chain into a combo ----

// ---- slice: glowing orbs are tossed up; swipe your index finger fast through them to cut them in half ----
const sl = { orbs: [], halves: [], next: 0, score: 0, best: loadBest("slice"), end: 0, over: -1e9, last: 0, prev: [], trail: [], swipeT: 0, swipeN: 0 };
const slice = {
  name: "Slice",
  get help() { return `swipe your index finger fast through the orbs to cut them\ncut several in one swipe for a bonus\n45 s rounds · best: ${sl.best}${audio ? "" : " · click once for sound"}`; },
  draw(now, dt) {
    dt = Math.min(dt, 40);
    const u = Math.min(W, H), g = H * 1.6e-6, playing = round(sl, now);
    if (playing && now > sl.next) {
      sl.next = now + 600 + R() * 500; const x = W * (.15 + R() * .7), r = u * (.045 + R() * .025);
      sl.orbs.push({ x, y: H + r, r, vx: (W / 2 - x) / W * .5 + (R() - .5) * .2, vy: -Math.sqrt(2 * g * H * (.55 + R() * .3)), hue: R() * 360 });
    }

      o.vy += g * dt; o.x += o.vx * dt; o.y += o.vy * dt;
      const cut = playing && blades.find(([a, b]) => segDist(o, a, b) < o.r);
      if (cut) {
        const ang = Math.atan2(cut[1].y - cut[0].y, cut[1].x - cut[0].x), nx = -Math.sin(ang) * .25, ny = Math.cos(ang) * .25;

      gr.addColorStop(0, "#fff"); gr.addColorStop(.45, `hsl(${o.hue}, 100%, 62%)`); gr.addColorStop(1, `hsla(${o.hue}, 100%, 50%, 0)`);

      ctx.fillStyle = `hsla(${h.hue}, 100%, 62%, ${h.life})`; ctx.beginPath();

  },
};

// ---- chip rows (fingertip dwell or click) ----
const DWELL_MS = 700, rows = []; // rows drawn this frame, for click hit-testing
function chipRow(names, active, y, dwell, dt, onPick) {
  ctx.save(); ctx.font = FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const widths = names.map(n => ctx.measureText(n).width + 30), gap = 8, h = 34;
  let x = (W - widths.reduce((a, b) => a + b + gap, -gap)) / 2;
  const chips = widths.map(w => { const r = { x, y, w, h }; x += w + gap; return r; });
  chips.forEach((r, i) => {
    const over = hands.some(hd => { const p = hd.s[8]; return p.x > r.x && p.x < r.x + r.w && p.y > r.y - 12 && p.y < r.y + r.h + 12; });
    dwell[i] = over && i !== active ? dwell[i] + dt : 0;
    if (dwell[i] > DWELL_MS) { dwell[i] = 0; onPick(i); }
    ctx.fillStyle = i === active ? UI.on : UI.pill; ctx.shadowColor = UI.shadow; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, h / 2); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = i === active ? "#fff" : UI.ink; ctx.fillText(names[i], r.x + r.w / 2, r.y + r.h / 2);
    if (dwell[i] > 0) { // dwell progress fills the pill from the left
      ctx.save(); ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, h / 2); ctx.clip();
      ctx.fillStyle = "rgba(47,125,85,.35)"; ctx.fillRect(r.x, r.y, r.w * dwell[i] / DWELL_MS, r.h); ctx.restore();
    }
  });
  ctx.restore();
  rows.push({ chips, onPick });
}
stage.addEventListener("click", e => rows.forEach(row => row.chips.forEach((r, i) => {
  if (e.clientX > r.x && e.clientX < r.x + r.w && e.clientY > r.y && e.clientY < r.y + r.h) row.onPick(i);
})));

// ---- modes, bottom bar, keys ----
const MODES = [portal, particles, paint, shapes, strings, synth, keepup, bubbles, slice];
let mode = 0;
const dwell = MODES.map(() => 0);
const modeBar = dt => chipRow(MODES.map(m => m.name), mode, H - 58, dwell, dt, i => mode = i);
addEventListener("keydown", e => {
  const n = +e.key; if (n >= 1 && n <= MODES.length) mode = n - 1;
  if (e.key === "e") effect = (effect + 1) % EFFECTS.length;
  if (e.key === "k") kaleido = !kaleido;
  if (e.key === "m" && MODES[mode] === synth) { if (!audio) startAudio(); else audio.muted = !audio.muted; }
  if (e.key === "v" && MODES[mode] === synth) vis = (vis + 1) % VISUALS.length;
  if (e.key === "b" && MODES[mode] === synth) { beat = (beat + 1) % BEATS.length; if (audio) audio.next = 0; }
  if (e.key === "r") toggleRec();
  if (e.key === "l" && MODES[mode] === synth) toggleLoop(true);

    ctx.fillStyle = "rgba(0,0,0,.15)"; ctx.fillRect(0, 0, W, H); // just enough to lift the overlays
  } else { ctx.fillStyle = "#05070a"; ctx.fillRect(0, 0, W, H); }
}
function drawHands() {
  ctx.save(); ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(255,255,255,.75)"; ctx.fillStyle = "#fff";
  for (const h of hands) {
    ctx.beginPath(); for (const [a, b] of CONN) { ctx.moveTo(h.s[a].x, h.s[a].y); ctx.lineTo(h.s[b].x, h.s[b].y); } ctx.stroke();

const sparks = [];
function sparkles(now) {
  for (const h of hands) for (const i of [4, 8, 12, 16, 20])
    sparks.push({ x: h.s[i].x, y: h.s[i].y, vx: (R() - .5) * 1.5, vy: (R() - .5) * 1.5 - .3, life: 1, hue: (now / 20 + i * 15) % 360 });

// ---- hand tracking: inference runs in tracker.js (a worker), results eased onto the screen every frame ----
const pair = c => [c.start ?? c[0], c.end ?? c[1]];
CONN = HandLandmarker.HAND_CONNECTIONS.map(pair);
const tracker = new Worker("tracker.js?v=3"); // bump when tracker.js changes: Pages caches it for 10 min
let trackerReady = false, busy = false, lastVideoTime = -1, startError = "", target = [], heldAt = 0;
const HOLD_MS = 200;
tracker.onmessage = ({ data }) => {
  if (data.type === "ready") trackerReady = true;
  else if (data.type === "error") { busy = false; console.warn("tracker:", data.message); }
  else if (data.type === "result") {
    busy = false;
    if (data.mask) segMask = data.mask;
    const fresh = data.hands.map((lm, i) => { const w = data.world?.[i] || lm; return { lm, w, s: lm.map(toScreen), fingers: countFingers(w), pinch: pinchOf(w) }; }).sort((a, b) => a.s[0].x - b.s[0].x);
    // at steep angles a hand can drop out for a frame or two: keep the last one briefly instead of letting gestures reset
    if (fresh.length >= target.length || performance.now() - heldAt > HOLD_MS) { target = fresh; heldAt = performance.now(); }
    const msg = target.length ? `TRACKING ${target.length} HAND${target.length > 1 ? "S" : ""}` : "NO HANDS";
    if (status.textContent !== msg) status.textContent = msg;
  }
};
async function init() {
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
    await video.play();
    tracker.postMessage({ type: "init" });
  } catch (e) {
    startError = `camera failed: ${e.message}\nallow camera access and open via http://localhost or https (demo mode below)\n\n`;
    status.textContent = "NO CAMERA";
  }
}
// hand one camera frame to the worker; never more than one in flight, so slow devices just track at a lower rate
async function pump() {
  if (!trackerReady || busy || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  busy = true; lastVideoTime = video.currentTime;
  try {
    const bitmap = await createImageBitmap(video);
    tracker.postMessage({ type: "frame", bitmap, t: performance.now(), wantSeg: (MODES[mode] === portal && needsSeg()) || (MODES[mode] === particles && model === 7) }, [bitmap]);
  } catch { busy = false; }
}
// glide on-screen points toward the latest detection, so motion is smooth at display rate between ~30 Hz results
function easeHands(dt) {
  if (target.length !== hands.length) { hands = target; return; }
  const k = 1 - Math.exp(-dt / 35);
  hands = target.map((h, i) => ({ ...h, s: h.s.map((p, j) => { const q = hands[i].s[j]; return { x: q.x + (p.x - q.x) * k, y: q.y + (p.y - q.y) * k }; }) }));
}

// ---- clip recording: what's on the stage (+ the sound, if it's on) → a video download ----
let recording = null;
const recBtn = $("rec");
function toggleRec() {
  if (recording) return recording.r.stop();
  const stream = stage.captureStream(30);
  // shortcut: sound is only captured if it was already on when recording started; re-record after turning it on
  const dest = audio?.ctx.createMediaStreamDestination();
  if (dest) { audio.an.connect(dest); stream.addTrack(dest.stream.getAudioTracks()[0]); }
  const type = ["video/webm;codecs=vp9,opus", "video/webm", "video/mp4"].find(t => MediaRecorder.isTypeSupported(t));
  const r = new MediaRecorder(stream, type ? { mimeType: type } : {}), chunks = [];
  r.ondataavailable = e => e.data.size && chunks.push(e.data);
  r.onstop = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(chunks, { type: r.mimeType }));
    a.download = `airmesh-${new Date().toISOString().slice(0, 19).replace(/[T:]/g, "-")}.${r.mimeType.includes("mp4") ? "mp4" : "webm"}`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1e4);
    stream.getTracks().forEach(t => t.stop()); if (dest) audio.an.disconnect(dest);
    recording = null; recBtn.classList.remove("on"); recBtn.textContent = "● REC";
  };
  r.start(1000); recording = { r, t0: performance.now() }; recBtn.classList.add("on");
}
recBtn.addEventListener("click", toggleRec);

let last = performance.now(), hudHtml = "";
const fps = { avg: 60, shown: 60, t: 0 };
function frame(now) {
  const dt = now - last; last = now;
  rows.length = 0;
  pump();
  easeHands(dt);
  background();
  MODES[mode].draw(now, dt);
  if (!MODES[mode].hidesHands) drawHands();
  if (!MODES[mode].noSparks) sparkles(now);
  MODES.forEach(m => m !== MODES[mode] && m.leave?.());
  modeBar(dt);
  if (now - fps.t > 500) { fps.shown = Math.round(fps.avg); fps.t = now; } // refresh the number twice a second, not every frame
  fps.avg += (1000 / Math.max(dt, 1) - fps.avg) * .05;
  const html = `${startError}<b>${MODES[mode].name}</b>   ${hands.length}/2 hands   ${fps.shown} FPS   tracking: ${status.textContent.toLowerCase()}\n<span class="dim">${MODES[mode].help}\nhover a mode below to switch · keys 1–${MODES.length} · R records</span>`;
  if (html !== hudHtml) hud.innerHTML = hudHtml = html; // only touch the DOM when the text changes
  if (recording) { const s = (now - recording.t0) / 1000 | 0, txt = `■ STOP ${s / 60 | 0}:${String(s % 60).padStart(2, "0")}`; if (recBtn.textContent !== txt) recBtn.textContent = txt; }
  requestAnimationFrame(frame);
}
init();
requestAnimationFrame(frame);
</script>
</body>
