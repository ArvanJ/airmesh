<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HoloHands</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: ui-monospace, Menlo, monospace; color: #dff; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* kept on-page (not display:none) so every browser keeps decoding frames */
  video { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  #hud { position: fixed; left: 24px; top: 20px; font-size: 13px; line-height: 1.7; white-space: pre; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #hud b { font-size: 20px; letter-spacing: .12em; color: #7ff0e8; }
  #status { position: fixed; right: 24px; top: 20px; letter-spacing: .15em; font-size: 16px; text-shadow: 0 1px 4px #000; pointer-events: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<video id="video" autoplay playsinline muted></video>
<div id="hud">loading hand model…</div>
<div id="status">STARTING</div>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import { HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $("video"), stage = $("stage"), ctx = stage.getContext("2d"), hud = $("hud"), status = $("status");
const TAU = Math.PI * 2, R = Math.random;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const FONT = "13px ui-monospace, Menlo, monospace";

// ---- screen <-> camera mapping (video is drawn mirrored, "cover" fit) ----
let W, H, map;
const DPR = Math.min(devicePixelRatio || 1, 1.5);
function layout() {
  W = innerWidth; H = innerHeight; stage.width = W * DPR; stage.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720, s = Math.max(W / vw, H / vh);
  map = { dw: vw * s, dh: vh * s, ox: (W - vw * s) / 2, oy: (H - vh * s) / 2 };
}
layout(); addEventListener("resize", layout); video.addEventListener("loadedmetadata", layout);
const toScreen = p => ({ x: map.ox + (1 - p.x) * map.dw, y: map.oy + p.y * map.dh });

// ---- hand helpers ----
const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const countFingers = lm =>
  [[8, 6], [12, 10], [16, 14], [20, 18]].filter(([tip, pip]) => d(lm[tip], lm[0]) > d(lm[pip], lm[0])).length
  + (d(lm[4], lm[17]) > d(lm[3], lm[17]) ? 1 : 0);
const pinchOf = lm => d(lm[4], lm[8]) / d(lm[0], lm[9]); // ~0.1 closed, ~1+ open
const PINCH = .3;

// self-check: synthetic open hand = 5 fingers, fist = 0
const fake = open => {
  const h = Array.from({ length: 21 }, () => ({ x: 0, y: 1 }));
  [6, 10, 14, 18].forEach(i => { h[i] = { x: 0, y: .5 }; h[i + 2] = { x: 0, y: open ? 0 : .8 }; });
  h[17] = { x: 1, y: .5 }; h[3] = { x: -.3, y: .6 }; h[4] = { x: open ? -.6 : .6, y: .6 };
  return h;
};
console.assert(countFingers(fake(true)) === 5 && countFingers(fake(false)) === 0, "countFingers self-check failed");

// hands: sorted left→right on screen; each {lm, s: screen points, fingers, pinch}
let hands = [];
const stab = { n: -1, c: 0 };
// finger count on the left hand, reported once it has held steady for 8 frames
function pickedCount() {
  if (!hands.length) return 0;
  const n = hands[0].fingers;
  stab.c = n === stab.n ? stab.c + 1 : 0; stab.n = n;
  return stab.c === 8 ? n : 0;
}

// ---- small drawing helpers ----
function marker(x, y, color = "#4ade80") {
  ctx.save(); ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 16;
  ctx.fillRect(x - 8, y - 8, 16, 16); ctx.restore();
}
function tag(text, x, y, color = "#7ff0e8") {
  ctx.save(); ctx.font = FONT;
  const w = ctx.measureText(text).width + 16; x = clamp(x, 8, W - w - 8); y = clamp(y, 20, H - 20);
  ctx.fillStyle = "rgba(5,10,15,.78)"; ctx.fillRect(x, y - 12, w, 24);
  ctx.strokeStyle = color; ctx.strokeRect(x, y - 12, w, 24);
  ctx.fillStyle = color; ctx.textBaseline = "middle"; ctx.fillText(text, x + 8, y);
  ctx.restore();
}

// =====================================================================
// MODE 2: Portal — thumb+index of both hands frame a live camera filter
// =====================================================================
const EFFECTS = ["Blueprint", "Thermal", "Matrix", "Pop art", "X-ray", "Neon edges", "Cartoon", "Sketch", "Emboss", "Night vision", "Glitch",
  "Cutout", "Ghost", "Invisible", "Predator", "Echo"];
const SEG_FX = ["Cutout", "Ghost", "Invisible", "Predator", "Echo"]; // these need the person/background mask
const needsSeg = () => SEG_FX.includes(EFFECTS[effect]);
const THERMAL = [[0, 0, 40], [90, 0, 170], [230, 0, 90], [255, 150, 0], [255, 255, 180]];
const SPARK = [[255, 255, 255], [255, 120, 220], [255, 230, 120], [160, 255, 230]];
const PIX = 4; // portal pixel size
const small = document.createElement("canvas"), sctx = small.getContext("2d", { willReadFrequently: true });
const maskSrc = document.createElement("canvas"), mctx = maskSrc.getContext("2d");
const maskSmall = document.createElement("canvas"), msctx = maskSmall.getContext("2d", { willReadFrequently: true });
let effect = 0, tapped = [false, false], segMask = null; // tapped: per hand pinch held, so one tap = one switch
// per-frame buffers for fx(): src = untouched camera pixels, plate = learned empty background, echo = fading person trails
let src, plate = null, echo = null, rowShift = [];
const blueprint = l => l < .25 ? [8, 10, 70] : l < .5 ? [25, 40, 190] : l < .72 ? [60, 120, 255] : [190, 215, 255];
const thermal = l => { const t = l * 3.999, i = Math.floor(t), f = t - i, p = THERMAL[i], q = THERMAL[i + 1];
  return [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f, p[2] + (q[2] - p[2]) * f]; };
const rainbow = a => [128 + 127 * Math.cos(a), 128 + 127 * Math.cos(a + 2.09), 128 + 127 * Math.cos(a + 4.19)];
const at = (buf, stride, x, y, w, h) => (clamp(y, 0, h - 1) * w + clamp(x, 0, w - 1)) * stride;
// l: luminance 0..1, gx/gy: Sobel gradient of l, m: person confidence 0..1, (x, y)/(w, h): pixel position, i: pixel index
function fx(l, r, g, b, gx, gy, m, x, y, w, h, i) {
  const e = Math.min(1, Math.hypot(gx, gy) * 1.5), cover = clamp((m - .25) / .3, 0, 1); // cover: how much "you" is here
  switch (EFFECTS[effect]) {
    case "Blueprint": return blueprint(l);
    case "Thermal": return thermal(l);
    case "Matrix": { const q = Math.round(l * 4) / 4; return [0, q * 255, q * 90]; }
    case "Pop art": return [b > 127 ? 255 : 0, r > 127 ? 230 : 20, g > 127 ? 255 : 60];
    case "X-ray": { const v = 255 - l * 255; return [v * .7, v * .9, v]; }
    case "Neon edges": return rainbow(Math.atan2(gy, gx)).map(c => c * e);
    case "Cartoon": return e > .35 ? [15, 15, 25] : [r, g, b].map(c => Math.min(255, Math.round(c / 64) * 70));
    case "Sketch": { const v = 255 - Math.min(255, e * 400); return [v, v * .97, v * .9]; }
    case "Emboss": { const v = clamp(128 + (gx - gy) * 90, 0, 255); return [v, v, v * 1.05]; }
    case "Night vision": { const v = clamp(l * 1.2 + R() * .12 - (y % 2 ? .12 : 0), 0, 1); return [v * 40, v * 255, v * 60]; }
    case "Glitch": { const s = rowShift[y], dim = y % 3 ? 1 : .7; // RGB channels torn sideways in random bands
      return [src[at(src, 4, x + s + 3, y, w, h)] * dim, src[at(src, 4, x + s, y, w, h) + 1] * dim, src[at(src, 4, x + s - 3, y, w, h) + 2] * dim]; }
    case "Cutout": return m > .5 ? [r, g, b].map(c => Math.min(255, c * 1.15)) : R() < .004 ? [255, 255, 255] : [20 + 50 * y / h, 0, 60 + 110 * x / w];
    case "Ghost": return m > .5 ? thermal(l) : blueprint(l);
    case "Invisible": { const o = i * 3; // swap "you" for the background learned from where you weren't
      return [r + (plate[o] - r) * cover, g + (plate[o + 1] - g) * cover, b + (plate[o + 2] - b) * cover]; }
    case "Predator": { const o = at(plate, 3, x + Math.round(gx * 5), y + Math.round(gy * 5), w, h), rim = cover * (1 - cover) * 4; // bent background + shimmering outline
      return [r + (plate[o] - r) * cover + 40 * rim, g + (plate[o + 1] - g) * cover + 90 * rim, b + (plate[o + 2] - b) * cover + 100 * rim]; }
    default: { const o = i * 3; return m > .5 ? [r, g, b] : [r * .6 + echo[o], g * .6 + echo[o + 1], b * .6 + echo[o + 2]]; } // Echo
  }
}
// person mask (video space) → the portal's mirrored low-res grid, drawn with the same transform as the video
function maskPixels(w, h) {
  const { w: mw, h: mh, data } = segMask;
  if (maskSrc.width !== mw || maskSrc.height !== mh) { maskSrc.width = mw; maskSrc.height = mh; }
  const mi = mctx.createImageData(mw, mh);
  for (let i = 0; i < data.length; i++) { mi.data[i * 4] = data[i] * 255; mi.data[i * 4 + 3] = 255; }
  mctx.putImageData(mi, 0, 0);
  if (maskSmall.width !== w || maskSmall.height !== h) { maskSmall.width = w; maskSmall.height = h; }
  msctx.save(); msctx.scale(1 / PIX, 1 / PIX); msctx.translate(W, 0); msctx.scale(-1, 1);
  msctx.drawImage(maskSrc, map.ox, map.oy, map.dw, map.dh); msctx.restore();
  const m = msctx.getImageData(0, 0, w, h).data, tmp = new Uint8Array(w * h), out = new Uint8Array(w * h * 4);
  // grow the mask 2px (separable max filter, like cv.dilate): the mask lags the video a frame, so this hides your outline
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let v = 0; for (let k = -2; k <= 2; k++) v = Math.max(v, m[(y * w + clamp(x + k, 0, w - 1)) * 4]); tmp[y * w + x] = v; }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let v = 0; for (let k = -2; k <= 2; k++) v = Math.max(v, tmp[clamp(y + k, 0, h - 1) * w + x]); out[(y * w + x) * 4] = v; }
  return out;
}
const portal = {
  name: "Portal",
  get help() { return `make an L with thumb + index on BOTH hands\nthe space between them becomes a live filter\nfilter: ${EFFECTS[effect]} — tap thumb + index together (or E) for the next one`; },
  draw(now) {
    hands.forEach((h, i) => { // tap = pinch closes after being open (hysteresis stops flicker re-triggering)
      if (h.pinch < PINCH && !tapped[i]) { tapped[i] = true; effect = (effect + 1) % EFFECTS.length; }
      else if (h.pinch > .5) tapped[i] = false;
    });
    if (hands.length < 2 || video.readyState < 2) {
      tag("raise both hands — thumb + index make the corners", W / 2 - 200, H / 2);
      return;
    }
    const [L, Rh] = hands, quad = [L.s[8], Rh.s[8], Rh.s[4], L.s[4]];

    // low-res mirrored copy of the screen, recoloured per pixel
    const w = Math.ceil(W / PIX), h = Math.ceil(H / PIX);
    if (small.width !== w || small.height !== h) { small.width = w; small.height = h; }
    sctx.save(); sctx.scale(1 / PIX, 1 / PIX); sctx.translate(W, 0); sctx.scale(-1, 1);
    sctx.drawImage(video, map.ox, map.oy, map.dw, map.dh); sctx.restore();
    const img = sctx.getImageData(0, 0, w, h), px = img.data, n = w * h;
    const lum = new Float32Array(n);
    for (let i = 0; i < n; i++) lum[i] = (.3 * px[i * 4] + .59 * px[i * 4 + 1] + .11 * px[i * 4 + 2]) / 255;
    const seg = needsSeg() && segMask ? maskPixels(w, h) : null;
    src = px.slice();
    if (seg) { // keep learning the empty background wherever you aren't; trails fade and get repainted where you are
      if (!plate || plate.length !== n * 3) { plate = new Float32Array(n * 3); echo = new Float32Array(n * 3); for (let i = 0; i < n * 3; i++) plate[i] = src[(i / 3 | 0) * 4 + i % 3]; }
      const col = rainbow(now / 300);
      for (let i = 0; i < n; i++) for (let k = 0; k < 3; k++) {
        const o = i * 3 + k;
        if (seg[i * 4] < 64) plate[o] += (src[i * 4 + k] - plate[o]) * .25;
        echo[o] = seg[i * 4] > 128 ? col[k] * .8 : echo[o] * .93;
      }
    }
    if (EFFECTS[effect] === "Glitch") { // bands of rows share a random sideways tear
      let sh = 0; rowShift = [];
      for (let y = 0; y < h; y++) { if (R() < .06) sh = R() < .4 ? 0 : Math.round(R() * 24 - 12); rowShift.push(sh); }
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x, o = i * 4, l = lum[i];
      let gx = 0, gy = 0; // Sobel, as in OpenCV's cv.Sobel with a 3x3 kernel
      if (x > 0 && y > 0 && x < w - 1 && y < h - 1) {
        gx = lum[i - w + 1] + 2 * lum[i + 1] + lum[i + w + 1] - lum[i - w - 1] - 2 * lum[i - 1] - lum[i + w - 1];
        gy = lum[i + w - 1] + 2 * lum[i + w] + lum[i + w + 1] - lum[i - w - 1] - 2 * lum[i - w] - lum[i - w + 1];
      }
      const c = needsSeg() && !seg ? [px[o], px[o + 1], px[o + 2]] // plain camera until the first mask arrives
        : effect < 5 && l > .55 && R() < .04 ? SPARK[(R() * SPARK.length) | 0] : fx(l, px[o], px[o + 1], px[o + 2], gx, gy, seg ? seg[o] / 255 : 1, x, y, w, h, i);
      px[o] = c[0]; px[o + 1] = c[1]; px[o + 2] = c[2];
    }
    sctx.putImageData(img, 0, 0);

    ctx.save();
    ctx.beginPath(); quad.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath();
    ctx.save(); ctx.clip(); ctx.imageSmoothingEnabled = false; ctx.drawImage(small, 0, 0, w * PIX, h * PIX); ctx.restore();
    ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 2; ctx.shadowColor = "#3b82f6"; ctx.shadowBlur = 12; ctx.stroke();
    ctx.restore();
    quad.forEach(p => marker(p.x, p.y));
    if (needsSeg() && !segMask) tag("finding you…", W / 2 - 60, H / 2 + 40, "#3b82f6");
    tag(`${EFFECTS[effect].toUpperCase()}  ${effect + 1}/${EFFECTS.length}`, Math.min(...quad.map(p => p.x)), Math.min(...quad.map(p => p.y)) - 28, "#3b82f6");
  },
};

// =====================================================================
// MODE 3: Particles 3D — rotate / zoom / explode a point-cloud model
// =====================================================================
const NP = 2200;
const MODELS = {
  1: ["Torus knot", i => { const t = i / NP * TAU, r = 2 + Math.cos(3 * t), j = () => (R() - .5) * .1;
    return [r * Math.cos(2 * t) * .33 + j(), -Math.sin(3 * t) * .33 + j(), r * Math.sin(2 * t) * .33 + j()]; }],
  2: ["DNA helix", i => {
    if (i % 3 === 2) { const t = Math.round(R() * 30) / 30, a = t * TAU * 3, u = R() * 2 - 1; return [Math.cos(a) * .45 * u, (t - .5) * 2.6, Math.sin(a) * .45 * u]; }
    const t = R(), a = t * TAU * 3 + (i % 3 ? Math.PI : 0); return [Math.cos(a) * .45, (t - .5) * 2.6, Math.sin(a) * .45]; }],
  3: ["Galaxy", i => { const r = R() ** .6 * 1.3, a = r * 4 + (i % 3) * TAU / 3 + (R() - .5) * .5;
    return [Math.cos(a) * r, (R() - .5) * .1 * (1.4 - r), Math.sin(a) * r]; }],
  4: ["Sphere", i => { const y = 1 - 2 * (i + .5) / NP, r = Math.sqrt(1 - y * y), a = i * 2.39996;
    return [Math.cos(a) * r * .9, y * .9, Math.sin(a) * r * .9]; }],
  5: ["Heart", () => { const t = R() * TAU, s = Math.sqrt(R());
    return [16 * Math.sin(t) ** 3 / 17 * s, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17 * s, (R() - .5) * .5 * s]; }],
};
const cloud = Array.from({ length: NP }, () => [0, 0, 0]);
const jit = Array.from({ length: NP }, () => [R() - .5, R() - .5, R() - .5]);
const CALLOUTS = [0, 550, 1100, 1650];
let model = 1, targets = [];
const setModel = n => { model = n; targets = Array.from({ length: NP }, (_, i) => MODELS[n][1](i)); };
setModel(1);
const view = { yaw: 0, pitch: .3, vy: 0, vx: 0, zoom: 1, boom: 0, cx: W / 2, cy: H / 2 };
let lastPalm = null;
const particles = {
  name: "Particles 3D",
  get help() { return `model: ${MODELS[model][0]} — left hand 1–5 fingers to change\nmove your right hand → spin · spread both hands → zoom\npinch → explode`; },
  draw(now) {
    const n = pickedCount(); if (MODELS[n] && n !== model) setModel(n);
    const drv = hands[hands.length - 1];
    if (drv) { const p = drv.s[9]; if (lastPalm) { view.vy += (p.x - lastPalm.x) * .0003; view.vx += (p.y - lastPalm.y) * .0003; } lastPalm = p; }
    else lastPalm = null;
    view.vy *= .94; view.vx *= .94;
    view.yaw += view.vy + .003; view.pitch = clamp(view.pitch + view.vx, -1.4, 1.4);
    if (hands.length === 2) view.zoom += (clamp(d(hands[0].s[8], hands[1].s[8]) / (W * .3), .4, 3) - view.zoom) * .15;
    view.boom += ((hands.some(h => h.pinch < PINCH) ? 1 : 0) - view.boom) * .08;
    const tx = hands.length === 2 ? (hands[0].s[9].x + hands[1].s[9].x) / 2 : W / 2;
    const ty = hands.length === 2 ? (hands[0].s[9].y + hands[1].s[9].y) / 2 : H / 2;
    view.cx += (tx - view.cx) * .15; view.cy += (ty - view.cy) * .15;

    const base = Math.min(W, H) * .32 * view.zoom, b = view.boom;
    const cy = Math.cos(view.yaw), sy = Math.sin(view.yaw), cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
    const proj = [];
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < NP; i++) {
      const c = cloud[i], t = targets[i];
      c[0] += (t[0] - c[0]) * .08; c[1] += (t[1] - c[1]) * .08; c[2] += (t[2] - c[2]) * .08;
      const x = c[0] * (1 + b * .8) + jit[i][0] * b * 1.6, y = c[1] * (1 + b * .8) + jit[i][1] * b * 1.6, z = c[2] * (1 + b * .8) + jit[i][2] * b * 1.6;
      const x1 = x * cy - z * sy, z1 = x * sy + z * cy, y1 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
      if (z2 < -3.5) continue;
      const f = base * 4 / (z2 + 4), sx = view.cx + x1 * f, syy = view.cy + y1 * f;
      if (CALLOUTS.includes(i)) proj.push([i, sx, syy, x, y, z]);
      ctx.fillStyle = `hsl(${(now / 40 + y * 90 + model * 50) % 360 | 0}, 90%, ${clamp(55 - z2 * 15, 25, 75) | 0}%)`;
      const s = clamp(f / base * 1.8, .6, 4); ctx.fillRect(sx - s / 2, syy - s / 2, s, s);
    }
    ctx.restore();

    // HUD dressing: orbit ring, callouts with live coordinates, hand-to-hand measure
    ctx.save();
    ctx.strokeStyle = "rgba(255,240,200,.7)"; ctx.lineWidth = 2; ctx.shadowColor = "#fff4c0"; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(view.cx, view.cy, base * 1.35, now / 1500, now / 1500 + 4.2); ctx.stroke();
    ctx.shadowBlur = 0; ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,.55)";
    proj.forEach(([i, sx, syy, x, y, z], k) => {
      const lx = k % 2 ? view.cx + base * 1.6 : view.cx - base * 1.6 - 170, ly = view.cy - base * .6 + k * base * .4;
      ctx.beginPath(); ctx.moveTo(sx, syy); ctx.lineTo(lx + (k % 2 ? 0 : 170), ly); ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.fillRect(sx - 2, syy - 2, 4, 4);
      tag(`pt ${i}  ${x.toFixed(2)}, ${y.toFixed(2)}, ${z.toFixed(2)}`, lx, ly, "#fff4c0");
    });
    if (hands.length === 2) {
      const a = hands[0].s[8], c = hands[1].s[8];
      ctx.setLineDash([5, 6]); ctx.strokeStyle = "#f5c542"; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(c.x, c.y); ctx.stroke();
      tag(`zoom ${view.zoom.toFixed(2)}×`, (a.x + c.x) / 2 - 40, (a.y + c.y) / 2 - 20, "#f5c542");
    }
    ctx.restore();
    tag(MODELS[model][0].toUpperCase(), view.cx - 60, view.cy + base * 1.35 + 30, "#7ff0e8");
  },
};

// =====================================================================
// MODE 4: Paint — pinch to draw glowing strokes, fist clears
// =====================================================================
let strokes = [], kaleido = false, fistFrames = 0, flash = 0;
const cur = [null, null];
const paint = {
  name: "Air Paint",
  get help() { return `pinch thumb + index to draw (both hands work)\nhold a fist ~1s → clear · K → kaleidoscope ${kaleido ? "ON" : "off"}`; },
  draw(now) {
    hands.forEach((h, i) => {
      const p = { x: (h.s[4].x + h.s[8].x) / 2, y: (h.s[4].y + h.s[8].y) / 2 };
      if (h.pinch < PINCH) {
        if (!cur[i]) { cur[i] = { pts: [], hue: (now / 15) % 360 }; strokes.push(cur[i]); }
        const q = cur[i].pts.at(-1);
        if (!q || d(q, p) > 3) cur[i].pts.push(p);
      } else cur[i] = null;

    });
    G3.uTime.value = now / 1000;
    G3.rings.forEach((r, i) => r.rotation.z = now / 2500 * (i % 2 ? -1 : 1) * (1 + i * .3));
    renderer.render(G3.scene, camera);
    ctx.drawImage(renderer.domElement, 0, 0, W, H);

    // callouts
    const labelCol = i => i === sel ? "#ffb43c" : xr.style ? SC.parts[i].pt.color : "#7ff0e8";
    ctx.save(); ctx.lineWidth = 1;
    for (const l of L) {
      const [x, y] = cent[l.i]; ctx.globalAlpha = l.i === sel ? 1 : .5; ctx.strokeStyle = ctx.fillStyle = labelCol(l.i);
      ctx.beginPath(); ctx.moveTo(l.side ? l.x : l.x + l.w, l.y); ctx.lineTo(x, y); ctx.stroke(); ctx.fillRect(x - 2, y - 2, 4, 4);
    }
    ctx.restore();
    for (const l of L) tag(SC.parts[l.i].pt.name, l.x, l.y, labelCol(l.i));
    if (SC.status) tag(SC.status, cx - 100, H / 2);
    else tag(xr.boom > .5 ? "EXPLODED VIEW" : "ASSEMBLED", cx - 60, H - 110, "#f5c542");

    if (sel >= 0) { // info card for the part being pointed at
      const p = SC.parts[sel].pt, lines = p.info.split("\n");
      ctx.save(); ctx.font = FONT;
      const w = Math.max(...lines.map(s => ctx.measureText(s).width), 160) + 28, h = 40 + lines.length * 20, x = 24, y = H - 172 - h;
      ctx.fillStyle = "rgba(5,10,15,.88)"; ctx.fillRect(x, y, w, h); ctx.strokeStyle = "#ffb43c"; ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = "#ffb43c"; ctx.font = "bold 15px ui-monospace, Menlo, monospace"; ctx.fillText(p.name, x + 14, y + 24);
      ctx.font = FONT; ctx.fillStyle = "#dff"; lines.forEach((s, i) => ctx.fillText(s, x + 14, y + 48 + i * 20));
      ctx.restore();
    }
    if (M === ENGINE) { // live 4-stroke table
      ctx.save(); ctx.font = FONT; const x0 = W - 210;
      ctx.fillStyle = "rgba(5,10,15,.7)"; ctx.fillRect(x0 - 12, 52, 198, 132);
      ctx.fillStyle = "#7ff0e8"; ctx.fillText("CYL  STROKE", x0, 74);
      CX.forEach((_, i) => { const [nm, col] = STROKES[cylState(i, xr.th).st]; ctx.fillStyle = col; ctx.fillText(`${i + 1}    ${nm}`, x0, 100 + i * 22); });
      ctx.restore();
    }
    tabs(); // menus last so they sit above the callouts
  },
};

// ---- modes, bottom bar, keys ----
const MODES = [portal, particles, paint, shapes, strings, synth, xray];
let mode = 0;
const dwell = MODES.map(() => 0);
const modeBar = dt => chipRow(MODES.map(m => m.name), mode, H - 58, dwell, dt, i => mode = i);
addEventListener("keydown", e => {
  const n = +e.key; if (n >= 1 && n <= MODES.length) mode = n - 1;
  if (e.key === "e") effect = (effect + 1) % EFFECTS.length;
  if (e.key === "k") kaleido = !kaleido;
  if (e.key === "m" && MODES[mode] === synth) { if (!audio) startAudio(); else audio.muted = !audio.muted; }
  if (e.key === "t") theme = (theme + 1) % THEMES.length;
  if (e.key === "c") strokes = [];
  if (e.key === "x") xr.explodeKey = !xr.explodeKey;
  if (e.key === "h") xr.style = 1 - xr.style;
  if (e.key === "+" || e.key === "=") xr.zoom = Math.min(3, xr.zoom * 1.1);
  if (e.key === "-") xr.zoom = Math.max(.4, xr.zoom / 1.1);
  if (e.key === "ArrowUp") xr.rpm = Math.min(9000, xr.rpm + 500);
  if (e.key === "ArrowDown") xr.rpm = Math.max(600, xr.rpm - 500);
});

// ---- always-on layers: camera, skeletons, fingertip sparks ----
let CONN = [];
function background() {
  if (video.readyState >= 2) {
    ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1); ctx.drawImage(video, map.ox, map.oy, map.dw, map.dh); ctx.restore();
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0, 0, W, H);
  } else { ctx.fillStyle = "#05070a"; ctx.fillRect(0, 0, W, H); }
}
function drawHands() {
  ctx.save(); ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(255,255,255,.75)"; ctx.fillStyle = "#fff";
  for (const h of hands) {
    ctx.beginPath(); for (const [a, b] of CONN) { ctx.moveTo(h.s[a].x, h.s[a].y); ctx.lineTo(h.s[b].x, h.s[b].y); } ctx.stroke();
    for (const p of h.s) { ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, TAU); ctx.fill(); }
  }
  ctx.restore();
}
const sparks = [];
function sparkles(now) {
  for (const h of hands) for (const i of [4, 8, 12, 16, 20])
    sparks.push({ x: h.s[i].x, y: h.s[i].y, vx: (R() - .5) * 1.5, vy: (R() - .5) * 1.5 - .3, life: 1, hue: (now / 20 + i * 15) % 360 });
  if (sparks.length > 600) sparks.splice(0, sparks.length - 600);
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.x += s.vx; s.y += s.vy; s.life -= .025;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.fillStyle = `hsla(${s.hue}, 100%, 60%, ${s.life})`; ctx.fillRect(s.x - 1.5, s.y - 1.5, 3, 3);
  }
  ctx.restore();
}

// ---- hand tracking: inference runs in tracker.js (a worker), results eased onto the screen every frame ----
const pair = c => [c.start ?? c[0], c.end ?? c[1]];
CONN = HandLandmarker.HAND_CONNECTIONS.map(pair);
const tracker = new Worker("tracker.js?v=2"); // bump when tracker.js changes: Pages caches it for 10 min
let trackerReady = false, busy = false, lastVideoTime = -1, startError = "", target = [];
tracker.onmessage = ({ data }) => {
  if (data.type === "ready") trackerReady = true;
  else if (data.type === "error") { busy = false; console.warn("tracker:", data.message); }
  else if (data.type === "result") {
    busy = false;
    if (data.mask) segMask = data.mask;
    target = data.hands.map(lm => ({ lm, s: lm.map(toScreen), fingers: countFingers(lm), pinch: pinchOf(lm) })).sort((a, b) => a.s[0].x - b.s[0].x);
    const msg = target.length ? `TRACKING ${target.length} HAND${target.length > 1 ? "S" : ""}` : "NO HANDS";
    if (status.textContent !== msg) status.textContent = msg;
  }
};
async function init() {
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
    await video.play();
    tracker.postMessage({ type: "init" });
  } catch (e) {
    startError = `camera failed: ${e.message}\nallow camera access and open via http://localhost or https (demo mode below)\n\n`;
    status.textContent = "NO CAMERA";
  }
}
// hand one camera frame to the worker; never more than one in flight, so slow devices just track at a lower rate
async function pump() {
  if (!trackerReady || busy || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  busy = true; lastVideoTime = video.currentTime;
  try {
    const bitmap = await createImageBitmap(video);
    tracker.postMessage({ type: "frame", bitmap, t: performance.now(), wantSeg: MODES[mode] === portal && needsSeg() }, [bitmap]);
  } catch { busy = false; }
}
// glide on-screen points toward the latest detection, so motion is smooth at display rate between ~30 Hz results
function easeHands(dt) {
  if (target.length !== hands.length) { hands = target; return; }
  const k = 1 - Math.exp(-dt / 35);
  hands = target.map((h, i) => ({ ...h, s: h.s.map((p, j) => { const q = hands[i].s[j]; return { x: q.x + (p.x - q.x) * k, y: q.y + (p.y - q.y) * k }; }) }));
}

let last = performance.now(), hudHtml = "";
function frame(now) {
  const dt = now - last; last = now;
  rows.length = 0;
  pump();
  easeHands(dt);
  background();
  MODES[mode].draw(now, dt);
  if (!MODES[mode].hidesHands) drawHands();
  if (!MODES[mode].noSparks) sparkles(now);
  MODES.forEach(m => m !== MODES[mode] && m.leave?.());
  modeBar(dt);
  const html = `${startError}<b>${MODES[mode].name.toUpperCase()}</b>\n${MODES[mode].help}\n\nhover a fingertip on a mode below to switch · keys 1–${MODES.length}`;
  if (html !== hudHtml) hud.innerHTML = hudHtml = html; // only touch the DOM when the text changes
  requestAnimationFrame(frame);
}
init();
requestAnimationFrame(frame);
</script>
</body>
</html>
