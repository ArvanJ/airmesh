name = "airmesh-tokens"
main = "index.js"
compatibility_date = "2026-10-01"

# Set the key once with:  npx wrangler secret put DECART_API_KEY
# (never put it in this file or anywhere in the repo)

# 3 tokens per visitor IP per minute
[[ratelimits]]
name = "TOKENS_PER_IP"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3
  period = 60
